# v0.17.0 gibi bir etiket pushlaninca RazerLite.exe'yi derler ve GitHub release'ine ekler.
# Programdaki "Guncellemeleri denetle" bu release'leri okur (Updater.cs).
name: Release

on:
  push:
    tags:
      - "v*"
  # Elle calistirma: yalnizca derler (deneme), release olusturmaz.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # Tam surum: "10.0.x" kanal indirmesi aka.ms -> dotnetorigin (409) uzerinden bozuk.
          dotnet-version: "10.0.402"

      - name: Publish (surum etiketten)
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # Etiketle calisirken surum etiketten, elle calisirken csproj'daki <Version> kullanilir.
          $extra = @()
          if ($env:IS_TAG -eq 'true') { $extra += "-p:Version=$($env:TAG.TrimStart('v'))" }
          dotnet publish src/RazerLite.csproj -c Release -o out --nologo @extra
          if (-not (Test-Path out/RazerLite.exe)) { throw "out/RazerLite.exe olusmadi" }
          (Get-Item out/RazerLite.exe).VersionInfo.FileVersion

      - name: Release olustur
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @($env:TAG, 'out/RazerLite.exe', '--title', "RazerLite $env:TAG", '--generate-notes')
          if ($env:TAG.Contains('-')) { $ghArgs += '--prerelease' }
          gh release create @ghArgs
